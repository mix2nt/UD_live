<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nw Description assistant</title>
    <style>
      :root {
        --bg: #f6f7fb;
        --panel: #ffffff;
        --muted: #6b7280;
        --text: #111827;
        --primary: #2563eb;
        --primary-soft: #dfe9ff;
        --line: #e5e7eb;
        --danger: #ef4444;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Arial", "Noto Sans KR", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .panel {
        width: 100%;
        max-width: 360px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 16px;
        background: var(--bg);
      }

      .title-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 2px;
      }

      .title-bar h2 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
      }

      .status {
        font-size: 12px;
        color: var(--muted);
        background: #eef2ff;
        border-radius: 999px;
        padding: 6px 10px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      }

      .prompt {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 200px;
        padding: 20px 12px;
        font-size: 18px;
        line-height: 1.5;
        color: var(--text);
        text-align: center;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
      }

      .prompt[hidden] {
        display: none !important;
      }

      .marker-box {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
      }

      .marker-chip {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 16px;
      }

      .marker-number {
        display: none;
      }

      .title-inline {
        flex: 1;
        min-width: 0;
      }

      .tag-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 0;
      }

      .tag {
        border: 1px solid var(--line);
        background: #f9fafb;
        color: var(--text);
        border-radius: 999px;
        padding: 7px 10px;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .tag:hover {
        background: var(--primary-soft);
        border-color: #b8ccff;
      }

      .field-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 12px;
        width: 100%;
      }

      .field-row {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
      }

      .field-badge {
        width: 42px;
        min-width: 42px;
        height: 32px;
        border-radius: 10px;
        background: #eef2ff;
        color: var(--primary);
        font-size: 13px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .field-row input {
        flex: 1;
      }

      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 8px;
      }

      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: white;
        outline: none;
        padding: 10px 12px;
        font-size: 14px;
        color: var(--text);
      }

      input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.12);
      }

      .primary-btn {
        width: 100%;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: white;
        font-weight: 700;
        font-size: 15px;
        padding: 12px 16px;
        cursor: pointer;
      }

      .primary-btn:hover {
        filter: brightness(1.03);
      }

      .save-btn {
        margin-top: auto;
      }

      .help {
        font-size: 11px;
        color: var(--muted);
        line-height: 1.5;
      }

      .phrase-screen {
        display: none;
        flex-direction: column;
        gap: 12px;
      }

      .phrase-screen.visible {
        display: flex;
      }

      .phrase-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 220px;
        overflow-y: auto;
      }

      .phrase-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        background: #f9fafb;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        text-align: left;
        cursor: pointer;
      }

      .phrase-item span {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .phrase-item button {
        border: none;
        background: transparent;
        color: var(--primary);
        font-weight: 700;
        cursor: pointer;
        padding: 0;
      }

      .back-btn {
        width: 40px;
        min-width: 40px;
        height: 40px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        color: var(--text);
        font-size: 22px;
        font-weight: 700;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .phrase-save-btn {
        margin-top: auto;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="title-bar">
        <h2>설명 도우미</h2>
        <div class="status" id="modeStatus">대기</div>
      </div>

      <div class="prompt" id="promptText">Figma의 아무 곳을 한 번 클릭하면 숫자 마커가 생성됩니다.</div>

      <div class="card" id="fieldCard" hidden>
        <div class="tag-row" aria-label="태그 선택">
          <button class="tag" type="button" data-tag="Title">Title</button>
          <button class="tag" type="button" data-tag="Dot">Dot</button>
          <button class="tag" type="button" data-tag="Dash">Dash</button>
          <button class="tag" type="button" data-tag="Phrases">Phrases</button>
        </div>
      </div>

      <div class="card phrase-screen" id="phraseScreen">
        <div class="title-bar">
          <h2>자주 쓰는 문장</h2>
          <button class="back-btn" type="button" id="phraseBackButton" aria-label="돌아가기">&#8249;</button>
        </div>

        <div class="field-row">
          <input id="phraseInput" type="text" placeholder="문장을 입력해 등록하세요" />
        </div>

        <div class="phrase-list" id="phraseList"></div>

        <button class="primary-btn phrase-save-btn" type="button" id="phraseAddButton">문장 등록</button>
      </div>

      <div class="card" id="editorCard" hidden>
        <div class="marker-box" id="markerBox">
          <div class="marker-chip" id="markerChip">1</div>
          <input id="titleInput" class="title-inline" type="text" placeholder="제목을 입력하세요" />
          <div class="marker-number" id="markerNumber">1</div>
        </div>
        <div class="field-list" id="fieldList"></div>
      </div>

      <div class="help" id="helpText">
        마커가 추가되면 제목 입력과 태그 도구가 나타납니다.
      </div>

      <button class="primary-btn save-btn" type="button" id="saveButton" hidden>저장</button>
    </div>

    <script>
      const tagButtons = document.querySelectorAll('.tag');
      const titleInput = document.getElementById('titleInput');
      const editorCard = document.getElementById('editorCard');
      const fieldCard = document.getElementById('fieldCard');
      const fieldList = document.getElementById('fieldList');
      const markerBox = document.getElementById('markerBox');
      const markerNumber = document.getElementById('markerNumber');
      const markerChip = document.getElementById('markerChip');
      const modeStatus = document.getElementById('modeStatus');
      const saveButton = document.getElementById('saveButton');
      const helpText = document.getElementById('helpText');
      const promptText = document.getElementById('promptText');
      const phraseScreen = document.getElementById('phraseScreen');
      const phraseAddButton = document.getElementById('phraseAddButton');
      const phraseBackButton = document.getElementById('phraseBackButton');
      const phraseInput = document.getElementById('phraseInput');
      const phraseList = document.getElementById('phraseList');

      let titleSequence = 1;
      const registeredPhrases = [
        '다음 단계로 진행합니다.',
        '필수 확인 사항입니다.',
        '추가 논의가 필요합니다.'
      ];

      function showMainView() {
        phraseScreen.classList.remove('visible');
        fieldCard.hidden = false;
        editorCard.hidden = false;
        saveButton.hidden = false;
      }

      function showPhraseView() {
        fieldCard.hidden = true;
        editorCard.hidden = true;
        saveButton.hidden = true;
        phraseScreen.classList.add('visible');
        modeStatus.textContent = '문장 관리';
        helpText.textContent = '자주 쓰는 문장을 등록하고 선택해 메인 입력에 넣을 수 있습니다.';
        phraseInput.focus();
      }

      function renderPhraseList() {
        phraseList.innerHTML = '';

        registeredPhrases.forEach((phrase) => {
          const item = document.createElement('button');
          item.type = 'button';
          item.className = 'phrase-item';

          const text = document.createElement('span');
          text.textContent = phrase;

          const action = document.createElement('button');
          action.type = 'button';
          action.textContent = '삽입';
          action.addEventListener('click', (event) => {
            event.stopPropagation();
            titleInput.value = `${titleInput.value}${titleInput.value ? ' ' : ''}${phrase}`;
            titleInput.focus();
            showMainView();
          });

          item.appendChild(text);
          item.appendChild(action);
          item.addEventListener('click', () => {
            titleInput.value = `${titleInput.value}${titleInput.value ? ' ' : ''}${phrase}`;
            titleInput.focus();
            showMainView();
          });

          phraseList.appendChild(item);
        });
      }

      function appendField(type) {
        const row = document.createElement('div');
        row.className = 'field-row';

        const badge = document.createElement('div');
        badge.className = 'field-badge';

        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = '입력하세요';

        if (type === 'Title') {
          const markerLabel = `1-${titleSequence}`;
          badge.textContent = markerLabel;
          titleSequence += 1;
          input.placeholder = '제목을 입력하세요';
        } else if (type === 'Dot') {
          badge.textContent = '·';
          input.value = '·';
          input.placeholder = '도트 문구를 입력하세요';
        } else if (type === 'Dash') {
          badge.textContent = '-';
          input.value = '-';
          input.placeholder = '대시 문구를 입력하세요';
        } else if (type === 'Phrases') {
          badge.textContent = '문장';
          input.placeholder = '자주 사용하는 문장을 입력하세요';
          showPhraseView();
          return;
        }

        row.appendChild(badge);
        row.appendChild(input);
        fieldList.appendChild(row);
        fieldList.scrollTop = fieldList.scrollHeight;
        input.focus();
      }

      tagButtons.forEach((button) => {
        button.addEventListener('click', () => {
          const tag = button.dataset.tag;
          if (tag === 'Phrases') {
            showPhraseView();
            return;
          }

          if (tag === 'Title' || tag === 'Dot' || tag === 'Dash') {
            appendField(tag);
          }
        });
      });

      phraseAddButton.addEventListener('click', () => {
        const newPhrase = phraseInput.value.trim();
        if (!newPhrase) {
          phraseInput.focus();
          return;
        }

        registeredPhrases.push(newPhrase);
        renderPhraseList();
        phraseInput.value = '';
        phraseInput.focus();
      });

      phraseBackButton.addEventListener('click', () => {
        showMainView();
        if (titleInput) {
          titleInput.focus();
        }
      });

      saveButton.addEventListener('click', () => {
        const title = titleInput.value.trim();
        parent.postMessage({ pluginMessage: { type: 'save-table', title, markerNumber: Number(markerNumber.textContent || '1') } }, '*');
      });

      window.addEventListener('message', (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;

        if (message.type === 'marker-ready') {
          promptText.hidden = true;
          editorCard.hidden = false;
          fieldCard.hidden = false;
          saveButton.hidden = false;
          markerNumber.textContent = String(message.markerNumber);
          markerChip.textContent = String(message.markerNumber);
          modeStatus.textContent = '활성';
          titleInput.focus();
          helpText.textContent = '태그를 추가하고 제목을 입력한 뒤 저장 버튼을 눌러 메모 표를 만드세요.';
          if (message.title) {
            titleInput.value = message.title;
          }
        }

        if (message.type === 'table-created') {
          modeStatus.textContent = '완료';
          helpText.textContent = '메모 표가 캔버스에 배치되었습니다. 필요하면 위치를 이동해 보세요.';
          titleInput.value = '';
        }
      });

      renderPhraseList();
    </script>
  </body>
</html>
