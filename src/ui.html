<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nw Description assistant</title>
    <style>
      :root {
        --bg: #f6f7fb;
        --panel: #ffffff;
        --muted: #6b7280;
        --text: #111827;
        --primary: #2563eb;
        --primary-soft: #dfe9ff;
        --line: #e5e7eb;
        --danger: #ef4444;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Arial", "Noto Sans KR", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .panel {
        width: 100%;
        max-width: 360px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 16px;
        background: var(--bg);
      }

      .title-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 2px;
      }

      .title-bar h2 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
      }

      .status {
        font-size: 12px;
        color: var(--muted);
        background: #eef2ff;
        border-radius: 999px;
        padding: 6px 10px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      }

      .prompt {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 200px;
        padding: 20px 12px;
        font-size: 18px;
        line-height: 1.5;
        color: var(--text);
        text-align: center;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
      }

      .prompt[hidden] {
        display: none !important;
      }

      .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .drag-handle,
      .mode-btn {
        flex: 1;
        min-height: 40px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--text);
        font-size: 13px;
        font-weight: 700;
        cursor: grab;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .mode-btn.active {
        background: var(--primary-soft);
        border-color: #b8ccff;
        color: var(--primary);
      }

      .marker-stack {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .marker-entry {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .marker-box {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0;
        border: none;
        background: transparent;
        transition: all 0.15s ease;
      }

      .marker-entry.is-active .marker-box {
        background: #f3f8ff;
        border-radius: 10px;
        padding: 4px 6px;
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.08);
      }

      .marker-chip {
        width: 28.8px;
        height: 28.8px;
        border-radius: 50%;
        border: 1px solid transparent;
        background: linear-gradient(135deg, #bfdbfe, #93c5fd);
        color: #1e3a8a;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 12.8px;
        flex-shrink: 0;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .marker-entry.is-active .marker-chip {
        background: linear-gradient(135deg, #dbeafe, #bfdbfe);
        color: #1d4ed8;
        border-color: rgba(37, 99, 235, 0.2);
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.12);
      }

      .marker-entry.is-inactive .marker-chip {
        background: linear-gradient(135deg, #e5e7eb, #d1d5db);
        color: #6b7280;
        border-color: #d1d5db;
        opacity: 0.9;
      }

      .marker-entry.is-inactive .marker-box {
        background: transparent;
      }

      .marker-number {
        display: none;
      }

      .marker-delete-btn {
        width: 28px;
        height: 28px;
        min-width: 28px;
        border: 1px solid #fecaca;
        border-radius: 8px;
        background: #fff1f2;
        color: #dc2626;
        font-size: 18px;
        line-height: 1;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .title-inline {
        flex: 1;
        min-width: 0;
        border: 1px solid #dfe5ee;
        background: white;
      }

      .marker-entry.is-inactive .title-inline {
        background: #f3f4f6;
        border-color: #e5e7eb;
        color: #6b7280;
      }

      .marker-entry.is-active .title-inline {
        border-color: rgba(59, 130, 246, 0.6);
        background: #f8fbff;
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.08);
      }

      .tag-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 0;
      }

      .tag {
        border: 1px solid var(--line);
        background: #f9fafb;
        color: var(--text);
        border-radius: 999px;
        padding: 7px 10px;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .tag:hover {
        background: var(--primary-soft);
        border-color: #b8ccff;
      }

      .field-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 12px;
        width: 100%;
      }

      .field-row {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
      }

      .field-chip {
        width: 28.8px;
        height: 28.8px;
        min-width: 28.8px;
        border-radius: 50%;
        background: linear-gradient(135deg, #dbeafe, #bfdbfe);
        color: #1d4ed8;
        font-size: 12px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .field-chip.dot-chip,
      .field-chip.dash-chip,
      .field-chip.phrase-chip {
        width: 28.8px;
        height: 28.8px;
        font-size: 14px;
      }

      .field-delete-btn {
        width: 28px;
        height: 28px;
        min-width: 28px;
        border: 1px solid #fecaca;
        border-radius: 8px;
        background: #fff1f2;
        color: #dc2626;
        font-size: 18px;
        line-height: 1;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .field-row input {
        flex: 1;
      }

      .field-row.is-active {
        background: #f3f8ff;
        border-radius: 10px;
        padding: 4px 6px;
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.08);
      }

      .field-row.is-active .field-chip {
        background: linear-gradient(135deg, #dbeafe, #bfdbfe);
        color: #1d4ed8;
        border-color: rgba(37, 99, 235, 0.2);
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.12);
      }

      .field-row.is-active input {
        border-color: rgba(59, 130, 246, 0.6);
        background: #f8fbff;
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.08);
      }

      .field-row input:focus,
      .field-row input:focus-visible {
        border-color: rgba(59, 130, 246, 0.6);
        background: #f8fbff;
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.08);
        outline: none;
      }

      .field-row.is-inactive {
        background: transparent;
        opacity: 0.85;
      }

      .field-row.is-inactive .field-chip {
        background: linear-gradient(135deg, #e5e7eb, #d1d5db);
        color: #6b7280;
      }

      .field-row.is-inactive input {
        background: #f3f4f6;
        border-color: #e5e7eb;
        color: #6b7280;
      }

      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 8px;
      }

      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: white;
        outline: none;
        padding: 10px 12px;
        font-size: 14px;
        color: var(--text);
      }

      input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.12);
      }

      .primary-btn {
        width: 100%;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: white;
        font-weight: 700;
        font-size: 15px;
        padding: 12px 16px;
        cursor: pointer;
      }

      .primary-btn:hover {
        filter: brightness(1.03);
      }

      .save-btn {
        margin-top: auto;
      }

      .help {
        font-size: 11px;
        color: var(--muted);
        line-height: 1.5;
      }

      .phrase-screen {
        display: none;
        flex-direction: column;
        gap: 12px;
      }

      .phrase-screen.visible {
        display: flex;
      }

      .phrase-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 220px;
        overflow-y: auto;
      }

      .phrase-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        background: #f9fafb;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        text-align: left;
        cursor: pointer;
      }

      .phrase-item span {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .phrase-item button {
        border: none;
        background: transparent;
        color: var(--primary);
        font-weight: 700;
        cursor: pointer;
        padding: 0;
      }

      .back-btn {
        width: 40px;
        min-width: 40px;
        height: 40px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        color: var(--text);
        font-size: 22px;
        font-weight: 700;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .phrase-save-btn {
        margin-top: auto;
      }

    </style>
  </head>
  <body>
    <div class="panel">
      <div class="title-bar">
        <h2>설명 도우미</h2>
        <div class="status" id="modeStatus">대기</div>
      </div>

      <div class="toolbar card">
        <button id="createMarkerButton" class="mode-btn" type="button">마커 추가</button>
        <button id="createTableButton" class="mode-btn" type="button">표 만들기</button>
        <div id="markerDragHandle" class="drag-handle" draggable="true" style="display:none;">마커 추가</div>
        <div id="tableDragHandle" class="drag-handle" draggable="true" style="display:none;">표 만들기</div>
      </div>

      <div class="prompt" id="promptText">Figma의 아무 곳을 한 번 클릭하면 숫자 마커가 생성됩니다.</div>

      <div class="card" id="editorCard" hidden>
        <div class="marker-stack" id="markerStack"></div>
      </div>

      <div class="card" id="fieldCard" hidden>
        <div class="tag-row" aria-label="태그 선택">
          <button class="tag" type="button" data-tag="Title">Title</button>
          <button class="tag" type="button" data-tag="Dot">Dot</button>
          <button class="tag" type="button" data-tag="Dash">Dash</button>
          <button class="tag" type="button" data-tag="Phrases">Phrases</button>
        </div>
      </div>

      <div class="card phrase-screen" id="phraseScreen">
        <div class="title-bar">
          <h2>자주 쓰는 문장</h2>
          <button class="back-btn" type="button" id="phraseBackButton" aria-label="돌아가기">&#8249;</button>
        </div>

        <div class="field-row">
          <input id="phraseInput" type="text" placeholder="문장을 입력해 등록하세요" />
        </div>

        <div class="phrase-list" id="phraseList"></div>

        <button class="primary-btn phrase-save-btn" type="button" id="phraseAddButton">문장 등록</button>
      </div>

      <div class="help" id="helpText">
        마커가 추가되면 제목 입력과 태그 도구가 나타납니다.
      </div>

      <button class="primary-btn save-btn" type="button" id="saveButton" hidden>디스크립션 생성</button>
    </div>

    <script>
      const tagButtons = document.querySelectorAll('.tag');
      const editorCard = document.getElementById('editorCard');
      const fieldCard = document.getElementById('fieldCard');
      const markerStack = document.getElementById('markerStack');
      const modeStatus = document.getElementById('modeStatus');
      const saveButton = document.getElementById('saveButton');
      const helpText = document.getElementById('helpText');
      const promptText = document.getElementById('promptText');
      const phraseScreen = document.getElementById('phraseScreen');
      const phraseAddButton = document.getElementById('phraseAddButton');
      const phraseBackButton = document.getElementById('phraseBackButton');
      const phraseInput = document.getElementById('phraseInput');
      const phraseList = document.getElementById('phraseList');
      const createMarkerButton = document.getElementById('createMarkerButton');
      const createTableButton = document.getElementById('createTableButton');
      const markerDragHandle = document.getElementById('markerDragHandle');
      const tableDragHandle = document.getElementById('tableDragHandle');

      let titleInput = null;
      let markerNumber = null;
      let markerChip = null;
      let activeEntry = null;
      let currentNodeId = null;
      let addModeActive = false;
      let lastFocusedTextField = null;
      const titleCounterByMarker = new Map();

      let titleSequence = 1;
      const registeredPhrases = [
        '다음 단계로 진행합니다.',
        '필수 확인 사항입니다.',
        '추가 논의가 필요합니다.'
      ];

      function setAddMode(nextState) {
        addModeActive = nextState;
        parent.postMessage({ pluginMessage: { type: 'toggle-add-mode', active: addModeActive } }, '*');
      }

      function collectCurrentTags() {
        if (!activeEntry) {
          return [];
        }

        const rows = activeEntry.querySelectorAll('.field-row');
        const tags = [];
        rows.forEach((row) => {
          const badge = row.querySelector('.field-badge');
          const input = row.querySelector('input');
          if (!badge || !input) {
            return;
          }
          const label = badge.textContent.trim();
          const value = input.value.trim();
          if (value) {
            tags.push({ label, value });
          }
        });
        return tags;
      }

      function syncMarkerEntryNumbers(records) {
        const nextMap = new Map((records || []).map((record) => [record.nodeId, record]));

        [...markerStack.children].forEach((entry) => {
          const record = nextMap.get(entry.dataset.nodeId);
          if (!record) {
            return;
          }

          const chip = entry.querySelector('.marker-chip');
          const numberEl = entry.querySelector('.marker-number');
          if (chip) {
            chip.textContent = String(record.number);
          }
          if (numberEl) {
            numberEl.textContent = String(record.number);
          }

          if (currentNodeId === entry.dataset.nodeId) {
            if (markerNumber) {
              markerNumber.textContent = String(record.number);
            }
            if (markerChip) {
              markerChip.textContent = String(record.number);
            }
          }
        });
      }

      function renderActiveList(records) {
        const nextIds = new Set((records || []).map((record) => record.nodeId));

        [...markerStack.children].forEach((entry) => {
          if (!nextIds.has(entry.dataset.nodeId)) {
            entry.remove();
          }
        });

        if (currentNodeId && !nextIds.has(currentNodeId)) {
          currentNodeId = null;
          activeEntry = null;
          titleInput = null;
          markerNumber = null;
          markerChip = null;
        }

        syncMarkerEntryNumbers(records);
      }

      function syncSingleFocusState(activeMarkerEntry = activeEntry, activeFieldRow = null) {
        [...markerStack.children].forEach((node) => {
          const isActive = !!activeMarkerEntry && node === activeMarkerEntry && !activeFieldRow;
          node.classList.toggle('is-active', isActive);
          node.classList.toggle('is-inactive', !isActive);
        });

        [...document.querySelectorAll('.field-row')].forEach((row) => {
          const isActive = row === activeFieldRow;
          row.classList.toggle('is-active', isActive);
          row.classList.toggle('is-inactive', !isActive);
          row.dataset.focused = String(isActive);
        });
      }

      function activateEntry(entry) {
        activeEntry = entry;
        titleInput = entry.querySelector('.title-inline');
        markerNumber = entry.querySelector('.marker-number');
        markerChip = entry.querySelector('.marker-chip');
        currentNodeId = entry.dataset.nodeId || null;
        syncSingleFocusState(entry, null);
      }

      function createMarkerEntry(number, nodeId) {
        const entry = document.createElement('div');
        entry.className = 'marker-entry is-inactive';
        entry.dataset.nodeId = nodeId;

        const markerBox = document.createElement('div');
        markerBox.className = 'marker-box';

        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'marker-chip';
        chip.textContent = String(number);
        chip.addEventListener('click', () => {
          const targetEntry = [...markerStack.children].find((entryNode) => entryNode.dataset.nodeId === nodeId);
          if (targetEntry) {
            activateEntry(targetEntry);
            if (titleInput) {
              titleInput.focus();
            }
          }
        });

        const input = document.createElement('input');
        input.className = 'title-inline';
        input.type = 'text';
        input.placeholder = '제목을 입력하세요';
        input.addEventListener('focusin', () => {
          lastFocusedTextField = input;
          const targetEntry = [...markerStack.children].find((entryNode) => entryNode.dataset.nodeId === nodeId);
          if (targetEntry) {
            activateEntry(targetEntry);
          }
        });

        const deleteButton = document.createElement('button');
        deleteButton.type = 'button';
        deleteButton.className = 'marker-delete-btn';
        deleteButton.setAttribute('aria-label', '마커 삭제');
        deleteButton.textContent = '×';
        deleteButton.addEventListener('click', (event) => {
          event.stopPropagation();
          parent.postMessage({ pluginMessage: { type: 'delete-active-item', nodeId } }, '*');
        });

        const numberEl = document.createElement('div');
        numberEl.className = 'marker-number';
        numberEl.textContent = String(number);

        markerBox.appendChild(chip);
        markerBox.appendChild(input);
        markerBox.appendChild(deleteButton);
        markerBox.appendChild(numberEl);

        const entryFields = document.createElement('div');
        entryFields.className = 'field-list';

        entry.appendChild(markerBox);
        entry.appendChild(entryFields);
        markerStack.appendChild(entry);
        activateEntry(entry);
        input.focus();
        return entry;
      }

      function showMainView() {
        phraseScreen.classList.remove('visible');
        fieldCard.hidden = false;
        editorCard.hidden = false;
        saveButton.hidden = false;

        const restoreTarget = lastFocusedTextField || titleInput;
        if (restoreTarget) {
          restoreTarget.focus();
        }
      }

      function showPhraseView() {
        lastFocusedTextField = getActiveTextField() || titleInput || lastFocusedTextField;
        fieldCard.hidden = true;
        editorCard.hidden = true;
        saveButton.hidden = true;
        phraseScreen.classList.add('visible');
        modeStatus.textContent = '문장 관리';
        helpText.textContent = '자주 쓰는 문장을 등록하고 선택해 메인 입력에 넣을 수 있습니다.';
        phraseInput.focus();
      }

      function getActiveMarkerNumber() {
        const rawNumber = markerNumber?.textContent || activeEntry?.querySelector('.marker-number')?.textContent || '1';
        const parsed = Number(rawNumber);
        return Number.isFinite(parsed) && parsed > 0 ? parsed : 1;
      }

      function getNextTitleValue() {
        const safeNodeId = currentNodeId || 'default';
        const nextCount = (titleCounterByMarker.get(safeNodeId) || 0) + 1;
        titleCounterByMarker.set(safeNodeId, nextCount);
        return `${getActiveMarkerNumber()}-${nextCount}`;
      }

      function getActiveTextField() {
        if (lastFocusedTextField && lastFocusedTextField.tagName === 'INPUT') {
          return lastFocusedTextField;
        }

        const focused = document.activeElement;
        if (focused && focused.tagName === 'INPUT' && focused.closest('.field-row, .title-inline')) {
          lastFocusedTextField = focused;
          return focused;
        }
        return titleInput || null;
      }

      function insertPhraseIntoActiveField(phrase) {
        const targetInput = lastFocusedTextField || getActiveTextField();
        if (!targetInput) {
          return;
        }

        const nextValue = `${targetInput.value}${targetInput.value ? ' ' : ''}${phrase}`;
        targetInput.value = nextValue;
        lastFocusedTextField = targetInput;
        targetInput.focus();
      }

      function renderPhraseList() {
        phraseList.innerHTML = '';

        registeredPhrases.forEach((phrase) => {
          const item = document.createElement('button');
          item.type = 'button';
          item.className = 'phrase-item';

          const text = document.createElement('span');
          text.textContent = phrase;

          const action = document.createElement('button');
          action.type = 'button';
          action.textContent = '삽입';
          action.addEventListener('click', (event) => {
            event.stopPropagation();
            insertPhraseIntoActiveField(phrase);
            showMainView();
          });

          item.appendChild(text);
          item.appendChild(action);
          item.addEventListener('click', () => {
            insertPhraseIntoActiveField(phrase);
            showMainView();
          });

          phraseList.appendChild(item);
        });
      }

      function appendField(type) {
        const currentEntry = activeEntry || null;
        const targetFieldList = currentEntry ? currentEntry.querySelector('.field-list') : null;
        if (!targetFieldList) {
          return;
        }

        const row = document.createElement('div');
        row.className = 'field-row is-inactive';
        row.dataset.focused = 'false';

        const chip = document.createElement('div');
        chip.className = 'field-chip';

        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = '입력하세요';

        const deleteButton = document.createElement('button');
        deleteButton.type = 'button';
        deleteButton.className = 'field-delete-btn';
        deleteButton.setAttribute('aria-label', '필드 삭제');
        deleteButton.textContent = '×';
        deleteButton.addEventListener('click', () => {
          row.remove();
        });

        if (type === 'Title') {
          const titleValue = getNextTitleValue();
          chip.textContent = titleValue;
          chip.classList.add('title-chip');
          input.value = titleValue;
          input.placeholder = '제목을 입력하세요';
        } else if (type === 'Dot') {
          chip.textContent = '·';
          chip.classList.add('dot-chip');
          input.value = '·';
          input.placeholder = '도트 문구를 입력하세요';
        } else if (type === 'Dash') {
          chip.textContent = '-';
          chip.classList.add('dash-chip');
          input.value = '-';
          input.placeholder = '대시 문구를 입력하세요';
        } else if (type === 'Phrases') {
          chip.textContent = '문';
          chip.classList.add('phrase-chip');
          input.placeholder = '자주 사용하는 문장을 입력하세요';
          showPhraseView();
          return;
        }

        const setFieldActiveState = (nextActive) => {
          if (nextActive) {
            syncSingleFocusState(activeEntry, row);
            return;
          }

          const nextFocusedRow = [...document.querySelectorAll('.field-row')].find((candidate) => candidate.dataset.focused === 'true' && candidate !== row);
          if (nextFocusedRow) {
            return;
          }

          syncSingleFocusState(activeEntry, null);
        };

        input.addEventListener('focusin', () => {
          lastFocusedTextField = input;
          setFieldActiveState(true);
        });
        input.addEventListener('focusout', (event) => {
          const nextTarget = event.relatedTarget;
          if (nextTarget && row.contains(nextTarget)) {
            return;
          }
          setFieldActiveState(false);
        });
        row.addEventListener('click', () => {
          if (document.activeElement !== input) {
            input.focus();
          }
          setFieldActiveState(true);
        });
        chip.addEventListener('click', () => {
          input.focus();
          setFieldActiveState(true);
        });

        row.appendChild(chip);
        row.appendChild(input);
        row.appendChild(deleteButton);
        targetFieldList.appendChild(row);
        targetFieldList.scrollTop = targetFieldList.scrollHeight;
        input.focus();
      }

      createMarkerButton.addEventListener('click', () => {
        parent.postMessage({ pluginMessage: { type: 'create-marker' } }, '*');
      });

      createTableButton.addEventListener('click', () => {
        parent.postMessage({ pluginMessage: { type: 'build-table' } }, '*');
      });

      markerDragHandle.addEventListener('dragstart', (event) => {
        event.dataTransfer.setData('application/x-ud-marker', 'marker');
        event.dataTransfer.effectAllowed = 'copy';
      });

      tableDragHandle.addEventListener('dragstart', (event) => {
        event.dataTransfer.setData('application/x-ud-table', 'table');
        event.dataTransfer.effectAllowed = 'copy';
      });

      tagButtons.forEach((button) => {
        button.addEventListener('click', () => {
          const tag = button.dataset.tag;
          if (tag === 'Phrases') {
            showPhraseView();
            return;
          }

          if (tag === 'Title' || tag === 'Dot' || tag === 'Dash') {
            appendField(tag);
          }
        });
      });

      phraseAddButton.addEventListener('click', () => {
        const newPhrase = phraseInput.value.trim();
        if (!newPhrase) {
          phraseInput.focus();
          return;
        }

        registeredPhrases.push(newPhrase);
        renderPhraseList();
        phraseInput.value = '';
        phraseInput.focus();
      });

      phraseBackButton.addEventListener('click', () => {
        showMainView();
        const targetInput = getActiveTextField();
        if (targetInput) {
          targetInput.focus();
        }
      });

      saveButton.addEventListener('click', () => {
        parent.postMessage({ pluginMessage: { type: 'build-table' } }, '*');
      });

      window.addEventListener('message', (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;

        if (message.type === 'active-list-updated') {
          renderActiveList(message.records || []);
        }

        if (message.type === 'marker-ready') {
          promptText.hidden = true;
          editorCard.hidden = false;
          fieldCard.hidden = false;
          saveButton.hidden = false;

          const entry = createMarkerEntry(message.markerNumber, message.nodeId);
          activateEntry(entry);
          markerNumber = entry.querySelector('.marker-number');
          markerChip = entry.querySelector('.marker-chip');
          currentNodeId = message.nodeId;

          modeStatus.textContent = '활성';
          titleInput = entry.querySelector('.title-inline');
          titleInput.focus();
          helpText.textContent = '태그를 추가하고 제목을 입력한 뒤 저장 버튼을 눌러 메모 표를 만드세요.';
          if (message.title) {
            titleInput.value = message.title;
          }
        }

        if (message.type === 'table-created') {
          modeStatus.textContent = '완료';
          helpText.textContent = '메모 표가 캔버스에 배치되었습니다. 필요하면 위치를 이동해 보세요.';
          if (titleInput) {
            titleInput.value = '';
          }
        }
      });

      renderPhraseList();
      renderActiveList([]);
    </script>
  </body>
</html>
